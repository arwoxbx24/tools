name: tools-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        shell: bash
        run: |
          set +e
          output=$(python3 tests/test_agent_tools.py 2>&1)
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            message=${output//$'\n'/%0A}
            printf '::error title=Unit tests failed::%s\n' "$message"
            exit "$status"
          fi
