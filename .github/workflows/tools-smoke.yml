name: tools-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_agent_tools.py
      - run: npx --yes jscpd@5.4.1 --baseline-from-ref origin/main --fail-on-new-clones=0 bin scripts
      - if: github.event_name == 'pull_request'
        run: bash bin/ship-doc-check "origin/${{ github.base_ref || 'main' }}"
      - run: bash bin/ship-doc-check-test
      - id: ship_chain
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^bin/(ship|ship-post|git-sync|git-auto-lib|git-state)$|^bin/ship-test$|^bin/ship-post-test$'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'push' || steps.ship_chain.outputs.changed == 'true'
        run: bash bin/ship-test
      - if: github.event_name == 'push' || steps.ship_chain.outputs.changed == 'true'
        timeout-minutes: 15
        run: bash bin/ship-post-test
      - run: bash bin/code-channel-test
      - run: bash bin/place-files-test
