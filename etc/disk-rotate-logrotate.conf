# spec:055 R12 — ротация логов, которые дописываются постоянно.
# Вызывает disk-rotate.sh: logrotate -s /var/lib/disk-rotate/logrotate.state <этот файл>.
# rotate 9999: logrotate сам ничего не удаляет — старые *.gz удаляет класс reports через гейт restic.
/root/workspaces/system/tools/scripts/logs/*.log {
    size 5M
    rotate 9999
    dateext
    dateformat -%Y%m%d-%s
    compress
    copytruncate
    missingok
    notifempty
    nomail
    su root root
}
