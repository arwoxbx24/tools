# spec:055 R12 — ротация логов, которые дописываются постоянно.
# Вызывает disk-rotate.sh: logrotate -s /var/lib/disk-rotate/logrotate.state <этот файл>.
# rotate 9999: logrotate сам ничего не удаляет — старые *.gz удаляет класс reports через гейт restic.
/root/workspaces/system/tools/scripts/logs/*.log {
    size 5M
    rotate 9999
    dateext
    dateformat -%Y%m%d-%s
    compress
    copytruncate
    missingok
    notifempty
    nomail
    su root root
}

# spec:055 R12 — журнал самого disk-rotate.sh: без копирования файла (ADR-3 dcfg-demsy.23) — копия 1.5 ГБ при ~1.4 ГиБ свободных дала бы ENOSPC, поэтому create переименовывает и места не требует.
/var/log/disk-rotate.log {
    size 5M
    rotate 9999
    dateext
    dateformat -%Y%m%d-%s
    compress
    create
    missingok
    notifempty
    nomail
    su root root
}
